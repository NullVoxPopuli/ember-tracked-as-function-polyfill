name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lints
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  addon:
    name: Addon tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ember-tracked-as-function-polyfill test
      - id: set-matrix
        working-directory: ember-tracked-as-function-polyfill
        run: echo "matrix=$(pnpm -s dlx @embroider/try list)" >> $GITHUB_OUTPUT

  test-apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - ember-cli-app
          - ember-cli-app-with-v1-addon
          - vite-app
          - vite-app-with-v1-addon
          - vite-app-with-v2-addon
          - minimum-supported/ember-cli-app
          - minimum-supported/ember-cli-app-with-v1-addon

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        working-directory: test-apps/${{ matrix.app }}

  try-scenarios:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: addon
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.addon.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply scenario
        working-directory: ember-tracked-as-function-polyfill
        run: pnpm dlx @embroider/try apply ${{ matrix.name }}
      - run: pnpm install --no-lockfile
      - run: pnpm --filter ember-tracked-as-function-polyfill test
        env: ${{ matrix.env }}
